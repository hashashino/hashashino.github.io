<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok embed test (GitHub Pages)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 720px; }
  h2 { margin: 24px 0 8px; font-size: 1.05rem; }
  iframe { width: 325px; height: 575px; border: 1px solid #ccc; display: block; }
  pre { background: #f4f4f4; padding: 8px; font-size: 12px; height: 160px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<p>Same public TikTok as the Vercel test, served from GitHub Pages. The log under each box shows every message TikTok's player sends.</p>

<h2>A. Plain player</h2>
<iframe id="fa" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<pre id="la"></pre>

<h2>B. Reload once on error 2001/3001</h2>
<iframe id="fb" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<pre id="lb"></pre>

<script>
const SRC = "https://www.tiktok.com/player/v1/7527204386305625400?music_info=1&description=1";
const boxes = {
  a: { frame: document.getElementById("fa"), log: document.getElementById("la"), retry: false, retried: false },
  b: { frame: document.getElementById("fb"), log: document.getElementById("lb"), retry: true,  retried: false }
};
function stamp() { return new Date().toLocaleTimeString(); }
function write(box, text) { box.log.textContent += stamp() + "  " + text + "\n"; box.log.scrollTop = box.log.scrollHeight; }

for (const k in boxes) {
  const b = boxes[k];
  b.frame.src = SRC;
  write(b, "iframe mounted");
  setTimeout(() => write(b, "--- 9 s check ---"), 9000);
  setTimeout(() => write(b, "--- 30 s check ---"), 30000);
}

window.addEventListener("message", (e) => {
  if (e.origin !== "https://www.tiktok.com" || !e.data || !e.data["x-tiktok-player"]) return;
  for (const k in boxes) {
    const b = boxes[k];
    if (e.source !== b.frame.contentWindow) continue;
    if (e.data.type === "onCurrentTime") return; // skip noisy progress events
    write(b, JSON.stringify(e.data));
    const code = e.data.value && e.data.value.errorCode;
    if (b.retry && !b.retried && (code === 2001 || code === 3001)) {
      b.retried = true;
      write(b, "retrying once...");
      b.frame.src = SRC;
    }
  }
});
</script>
</body>
</html>
